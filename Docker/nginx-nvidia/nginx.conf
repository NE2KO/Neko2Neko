events {}

http {
    limit_req_zone $binary_remote_addr zone=nvidia:10m rate=39r/m;

    server {
        listen 4000;

        location / {

            limit_req zone=nvidia burst=5 nodelay;
            limit_req_status 429;

            add_header X-RateLimit-Source nginx always;
            add_header Retry-After 5 always;

            proxy_pass https://integrate.api.nvidia.com;
            proxy_ssl_server_name on;

            proxy_set_header Host integrate.api.nvidia.com;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type $http_content_type;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}
